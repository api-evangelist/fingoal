- aid: fingoal:fingoal-client-management-api
  name: FinGoal Client Management API
  description: "There are three kinds of people who interact with Link Money: \n- **Users** are the people\
    \ who use the Link Money application. They are the people who log in, view their accounts, and make\
    \ transactions.\n- **Clients** are the people who use the Link Money API. They are the people who\
    \ build applications that interact with the Link Money API.\n- **Tenants** are the organizations that\
    \ use Link Money. They are the people who manage the users and clients who interact with Link Money.\
    \ Generally speaking, the `user` is an end user of the `tenant`'s application, and the `client` is\
    \ a developer who is building the `tenant`'s application. \n\nEvery developer must have a client configuration\
    \ in order to access Link Money. This includes developers who are operating within a tenant environment\
    \ that they themselves manage. \n\n## Webhooks \nLink Money supports all available Yodlee webhooks,\
    \ which are documented in the [Yodlee API documentation](https://developer.envestnet.com/resources/yodlee/webhooks/docs).\
    \ Developers can subscribe to webhooks by sending requests to the Link Money API webhook management\
    \ endpoints. \n\nAs each Link Money tenant is a separate environment, each tenant requires its own\
    \ webhook subscription. Make sure you authenticate with a token that has the proper tenant ID to ensure\
    \ tha the webhook subscription is created in the correct tenant environment.\n\nLink Money tenants\
    \ are shared by multiple clients, so it is possible to receive webhook notifications from customers\
    \ who are not specifically accessing your application. Make sure that your application logic accounts\
    \ for events that are related to users who other clients may have registered."
