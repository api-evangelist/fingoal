aid: fingoal
name: FinGoal
description: >-
  FinGoal provides financial data insights for banks, credit unions, and
  fintechs. Its Insights API enriches raw bank and card transaction data with
  clean merchant names, categorization, and behavioral "Persona Tags" that power
  personalized recommendations, targeted offers, and better banking features.
  The API is batch-oriented: developers submit transactions, receive a
  batch_request_id, and collect enriched results by polling or via ENRICHMENT_DATA
  and USER_TAGS_DATA webhooks. FinGoal also offers Link Money for account
  aggregation and verification across 17,000+ financial institutions.
  Authentication uses a JWT minted from client_id/client_secret; developer
  credentials are issued on request. FinGoal is SOC 2 Type II and GDPR compliant.
