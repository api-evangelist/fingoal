- aid: fingoal:fingoal-link-money-api
  name: FinGoal Link Money API
  description: >-
    Link Money is an authentication portal in front of a shared account-aggregation
    instance. A bank or credit union buys one aggregation environment (a "tenant"),
    and Link Money authenticates its several fintech partners into that same silo
    instead of each of them integrating an aggregator separately. Developers mint a
    tenant-scoped JWT from clientId/clientSecret/tenantId, retrieve Yodlee FastLink 4
    session details to open the account-linking widget in their own frontend, and
    register HTTPS webhooks for aggregation events (DATA_UPDATES, REFRESH,
    AUTO_REFRESH_UPDATES, LATEST_BALANCE_UPDATES, CDV_STATUS_UPDATES, OB_CONSENT,
    OB_ACTIVE_CONSENT_REMINDER). Beyond the nine described operations the API is a
    direct proxy to the Yodlee Core API, surfaced unaltered except that the user's
    loginName moves into a request header. Only a development server is published.
