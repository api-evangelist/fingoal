openapi: 3.2.0
info:
  title: Insights Enrichment API
  description: '# Overview

    Download our postman collection here.'
  version: 3.1.3
servers:
- url: https://findmoney-dev.fingoal.com/v3
  description: Insights API Development
- url: https://findmoney.fingoal.com/v3
  description: Insights API Production
security:
- Authentication: []
tags:
- name: Enrichment
  description: The Insights API's transaction enrichment endpoints enable developers to clean and enhance their transaction data.
paths:
  /cleanup/sync:
    post:
      tags:
      - Enrichment
      summary: Test Transaction Enrichment
      description: 'The test transaction enrichment endpoint provides immediate enrichment on transaction data. This endpoint is ideal for testing API functionality and previewing enrichment results.


        **This endpoint is not intended for production use.** Use the historical and streaming endpoints for production-level enrichment.


        For optimal performance, adhere to the following limits:

        - Submit no more than 4 unique users per request. Users are distinguished by the `uid` field in each transaction.

        - Submit no more than 16 transactions per user per request if sending multiple users. Send no more than 128 if sending a single user.'
      operationId: syncCleanupTransactions
      security:
      - Authentication:
        - enrichment
      requestBody:
        description: Transactions
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupPostRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrichedTransactions:
                    type: object
                    properties:
                      enriched:
                        type: array
                        items:
                          type: object
                          properties:
                            accountid:
                              description: The ID of the account associated with the transaction
                              type: string
                            amountnum:
                              description: The transaction's USD amount
                              type: number
                            category:
                              description: The most applicable categorization for the transaction
                              type: string
                            categoryId:
                              description: The numeric ID of the transaction's category
                              type: number
                            categoryLabel:
                              description: A cascading hierarchy of the transaction's categories, from high-level to detail-level categorization. This field is deprecated and not recommended for use, as it may not reflect more correct information available in other 'category' fields.
                              type: array
                              deprecated: true
                              items:
                                type: string
                            client_id:
                              type: string
                              description: Your FinGoal client ID
                            container:
                              description: A high-level categorization of the account type. Eg, 'bank'
                              type: string
                            date:
                              description: The date on which the transaction took place
                              type: string
                              format: date-time
                            detailCategoryId:
                              description: The numeric ID of the transaction's detail category
                              type: number
                            guid:
                              description: The transaction's globally unique FinSight API issued ID
                              type: string
                            highLevelCategoryId:
                              description: The numeric ID of the transaction's high level category
                              type: number
                            isPhysical:
                              description: Whether the transaction was made at a physical location, or online
                              type: boolean
                            isRecurring:
                              deprecated: true
                              description: This field is deprecated. Denotes whether the transaction is set to recur on a fixed interval
                              type: boolean
                            merchantAddress1:
                              description: The street address of the merchant associated with the transaction
                              type: string
                            merchantCity:
                              description: The name of the city where the merchant is located
                              type: string
                            merchantCountry:
                              description: The name of the country where the merchant is located
                              type: string
                            merchantLatitude:
                              description: The latitude of the merchant
                              type: string
                            merchantLogoURL:
                              description: The URL resource for the merchant's logo
                              type: string
                            merchantLongitude:
                              description: The longitude of the merchant
                              type: string
                            merchantName:
                              description: The name of the merchant associated with the transaction
                              type: string
                            merchantPhoneNumber:
                              description: The phone number of the merchant associated with the transaction
                              type: string
                            merchantState:
                              description: The name of the state where the merchant is located
                              type: string
                            merchantType:
                              description: The merchant's type
                              type: string
                            merchantZip:
                              type: string
                              description: The ZIP code where the merchant is located
                            original_description:
                              description: The transaction description as received. This will not change
                              type: string
                            receiptDate:
                              description: The date on which FinSight API first received the transaction
                              type: string
                              format: date-time
                            requestId:
                              description: A unique ID for the request the transaction came in with, for debugging purposes
                              type: string
                            simple_description:
                              description: An easy-to-understand, plain-language transaction description
                              type: string
                              deprecated: true
                            simpleDescription:
                              description: An easy-to-understand, plain-language transaction description
                              type: string
                            sourceId:
                              description: The source of the transaction
                              type: string
                            subType:
                              description: A more detailed classification that provides further information on the type of transaction.
                              type: string
                            tenant_id:
                              description: The ID of the tenant associated with this transaction, if one was included.
                              type: string
                            transactionid:
                              description: The ID of the transaction as it was originally submitted
                              type: string
                            transactionTags:
                              description: The FinSight API issued tags for the transaction
                              type: array
                              items:
                                type: string
                            type:
                              description: An attribute describing the nature of the intent behind the transaction.
                              type: string
                            uid:
                              description: The ID of the user associated with the transaction, as originally submitted
                              type: string
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            amountnum:
                              description: The transaction's USD amount
                              type: number
                            settlement:
                              description: The settlement type of the transaction (e.g., 'debit' or 'credit')
                              type: string
                            original_description:
                              description: The transaction description as received. This will not change
                              type: string
                            transactionid:
                              description: The ID of the transaction as it was originally submitted
                              type: string
                            date:
                              description: The date on which the transaction took place
                              type: string
                              format: date-time
                            accountType:
                              description: The type of account (e.g., 'checking')
                              type: string
                            uid:
                              description: The ID of the user associated with the transaction, as originally submitted
                              type: string
                            error_message:
                              type: string
                              description: A message describing why the transaction failed to enrich.
        '400':
          description: Bad request. An array of errors in the data will be returned. Fields not allowed or incorrectly formatted will be noted.
        '401':
          description: Unauthorized
  /cleanup:
    post:
      tags:
      - Enrichment
      summary: Historical Transaction Enrichment
      description: 'The historical transaction enrichment endpoint is designed for enriching a large number of transactions. It is optimized to handle substantial payloads and efficiently process large backlogs of data.


        This endpoint is asynchronous. A webhook will be sent to the provided URL when a batch of transactions has been enriched.


        To maximize throughput for this endpoint, follow these guidelines:

        - Group transactions by `uid` and include all transactions for a single `uid` in the same payload.

        - Limit each request to approximately 1,000 transactions. The payload can include multiple uids.'
      operationId: asyncCleanupTransactions
      security:
      - Authentication:
        - enrichment
      requestBody:
        description: Transactions
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupPostRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPost200Response'
        '400':
          description: Bad request. An array of errors in the data will be returned. Fields not allowed or incorrectly formatted will be noted.
        '401':
          description: Unauthorized
      callbacks:
        enrichment_result:
          https://YOUR_CALLBACK_URI:
            post:
              security: []
              summary: Enrichment Webhook
              parameters:
              - name: X-Webhook-Verification
                in: header
                required: true
                schema:
                  type: string
                description: A SHA-256 HMAC signature of the webhook payload that can be used to verify the authenticity of the webhook.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/EnrichmentNotificationPostRequest'
  /cleanup/streaming:
    post:
      tags:
      - Enrichment
      summary: Streaming Transaction Enrichment
      description: 'FinGoal''s streaming transaction enrichment endpoint is designed for enriching daily user transactions or other smaller transaction batches.


        Unlike the historical transaction enrichment endpoint, the streaming transaction enrichment endpoint does not require any user segmentation. Requests that include many users (by uid) will not deteriorate the endpoint''s performance.


        This endpoint is asynchronous. A webhook will be sent to the provided URL when a batch of transactions has been enriched. For larger transaction sets, such as historical data, user the historical enrichment endpoint.


        To maximize throughput for this endpoint, follow these guidelines:

        - Group transactions by "uid" and include all transactions for a single user in the same payload.

        - Limit each request to a total of approximately 1,000 transactions.

        - Transactions can be distributed among any number of users as long as the total number of transactions does not exceed 1,000.'
      operationId: streamingCleanupTransactions
      security:
      - Authentication:
        - enrichment
      requestBody:
        description: Transactions
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupPostRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPost200Response'
        '400':
          description: Bad request. An array of errors in the data will be returned. Fields not allowed or incorrectly formatted will be noted.
        '401':
          description: Unauthorized
      callbacks:
        enrichment_result:
          https://YOUR_CALLBACK_URI:
            post:
              security: []
              summary: Enrichment Complete Notification
              parameters:
              - name: X-Webhook-Verification
                in: header
                required: true
                schema:
                  type: string
                description: A SHA-256 HMAC signature of the webhook payload that can be used to verify the authenticity of the webhook.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/EnrichmentNotificationPostRequest'
  /cleanup/base:
    post:
      tags:
      - Enrichment
      summary: Base Transaction Enrichment
      description: 'FinGoal''s base transaction enrichment endpoint is a new and improved model for enriching daily user, historical, or one off user transactions. It accepts additional `accountTypes` that previous enrichment endpoints did not, including `businessChecking`, `businessSavings`, `businessCreditCard`, `businessLoan`, `loan`, `investments`.


        Requests that include many users (by uid) will not deteriorate the endpoint''s performance and it has much higher throughput than previous enrichment endpoints.


        This endpoint is asynchronous. A webhook will be sent to the provided URL when a batch of transactions has been enriched.


        To maximize throughput for this endpoint, follow these guidelines:

        - Limit each request to a total of approximately 1,000 transactions.

        - Transactions can be distributed among any number of users as long as the total number of transactions does not exceed 1,000.'
      operationId: baseCleanupTransactions
      security:
      - Authentication:
        - enrichment
      requestBody:
        description: Transactions
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - transactions
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    required:
                    - accountType
                    - amountnum
                    - date
                    - original_description
                    - transactionid
                    - settlement
                    - uid
                    properties:
                      accountType:
                        type: string
                        description: 'The type of account associated with the transaction.

                          '
                        enum:
                        - checking
                        - savings
                        - creditCard
                        - businessChecking
                        - businessSavings
                        - businessCreditCard
                        - businessLoan
                        - loan
                        - investments
                        example: checking
                      amountnum:
                        type: number
                        maxLength: 11
                        description: The transaction amount in USD. Negative amounts are automatically converted to positive amounts. Use the 'settlement' field to indicate whether the transaction was a 'debit' or 'credit'. The string representation of amount must be fewer than 11 characters.
                        example: 19.99
                      date:
                        description: The date of the transaction. Must be in the format 'YYYY-MM-DD'.
                        type: string
                        format: date
                        example: '2024-05-01'
                      identifiers:
                        description: A JSON representation of alternative user IDs. This field is designed exclusively for users with Banno, Salesforce, or other CRM integrations. Valid identifiers are currently limited to [`sfmc_contact_id`, `banno_end_user_id`].
                        type: object
                        properties:
                          sfmc_contact_id:
                            type: string
                            example: sfmc-1234
                          banno_end_user_id:
                            type: string
                            example: banno-1234
                      original_description:
                        description: 'The transaction''s description. Must be between 3 and 198 characters. Descriptions longer than 198 characters are automatically truncated.

                          '
                        minLength: 1
                        maxLength: 198
                        type: string
                        example: Cottonwood Supermarket & Deli
                      transactionid:
                        description: A unique identifier for the transaction. Do not use PII or other information-rich data in this field. We strongly recommend using UUID or a similar identification system.
                        maxLength: 100
                        type: string
                        example: 178b1f61-dafe-4d47-837b-54ce34dc82b2
                      settlement:
                        description: Indicates whether the transaction was a 'debit' or 'credit' to the account.
                        type: string
                        enum:
                        - debit
                        - credit
                        example: debit
                      uid:
                        description: The ID of the user associated with the transaction. User IDs must be unique. Do not use PII or other information-rich data in this field. We strongly recommend using UUID or a similar identification system.
                        maxLength: 50
                        type: string
                        example: user123
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPost200Response'
        '400':
          description: Bad request. An array of errors in the data will be returned. Fields not allowed or incorrectly formatted will be noted.
        '401':
          description: Unauthorized
      callbacks:
        enrichment_result:
          https://YOUR_CALLBACK_URI:
            post:
              security: []
              summary: Enrichment Complete Notification
              parameters:
              - name: X-Webhook-Verification
                in: header
                required: true
                schema:
                  type: string
                description: A SHA-256 HMAC signature of the webhook payload that can be used to verify the authenticity of the webhook.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/EnrichmentNotificationPostRequest'
  /cleanup/{batch_request_id}:
    get:
      tags:
      - Enrichment
      summary: Retrieve Enrichment by Batch Request ID
      description: 'Developers may use this endpoint in conjunction with the asynchronous cleanup endpoints to retrieve the results of a transaction cleanup operation by its batch operation ID.

        The operation ID can be extracted from the webhook that the async cleanup endpoint sends when enrichment is complete.'
      operationId: getEnrichment
      security:
      - Authentication:
        - enrichment
      parameters:
      - name: batch_request_id
        in: path
        description: The Batch Request ID of the enrichment request.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigurationsTestPostENRICHMENT_DATA'
        '401':
          description: Unauthorized
        '404':
          description: No transactions found for the given request id.
components:
  schemas:
    CleanupPost200Response:
      type: object
      properties:
        transactions_received:
          type: boolean
          description: Denotes whether FinSight API has successfully received the transactions.
        transactions_validated:
          type: boolean
          description: Denotes whether or not the transaction payload successfully passed FinSight API validation.
        processing:
          type: boolean
          description: Denotes whether the asynchronous enrichment process has commenced.
        num_transactions_processing:
          type: integer
          description: The number of transactions that have been received.
        batch_request_id:
          type: string
          description: A unique ID associated with the request for debugging.
    WebhookConfigurationsTestPostENRICHMENT_DATA:
      type: object
      properties:
        enrichedTransactions:
          type: array
          items:
            type: object
            properties:
              accountid:
                description: The ID of the account associated with the transaction
                type: string
              accountType:
                description: The type of account associated with the transaction (e.g., 'checking', 'savings')
                type: string
              amountnum:
                description: The transaction's USD amount
                type: number
              category:
                description: The most applicable categorization for the transaction
                type: string
              categoryId:
                description: The numeric ID of the transaction's category
                type: number
              categoryLabel:
                deprecated: true
                description: A cascading hierarchy of the transaction's categories, from high-level to detail-level categorization. This field is deprecated and not recommended for use, as it may not reflect more correct information available in other 'category' fields.
                type: array
                items:
                  type: string
              address:
                description: The address associated with the transaction
                type:
                - string
                - 'null'
                example: 123 Main St
              city:
                description: The city associated with the transaction
                type:
                - string
                - 'null'
                example: Urbana
              client_id:
                type: string
                description: Your FinGoal client ID
              container:
                description: A high-level categorization of the account type. Eg, 'bank'
                type:
                - string
                - 'null'
                example: Transaction
              date:
                description: The date on which the transaction took place
                type: string
                format: date-time
              detailCategoryId:
                description: The numeric ID of the transaction's detail category
                type: number
              guid:
                description: The transaction's globally unique FinSight API issued ID
                type: string
              highLevelCategoryId:
                description: The numeric ID of the transaction's high level category
                type: number
              isPhysical:
                description: Whether the transaction was made at a physical location, or online
                type:
                - boolean
                - 'null'
                example: true
              isRecurring:
                deprecated: true
                description: This field is deprecated. Denotes whether the transaction is set to recur on a fixed interval
                type:
                - boolean
                - 'null'
                example: false
              merchantAddress1:
                description: The street address of the merchant associated with the transaction
                type:
                - string
                - 'null'
                example: 123 Main St
              merchantCity:
                description: The name of the city where the merchant is located
                type:
                - string
                - 'null'
                example: Urbana
              merchantCountry:
                description: The name of the country where the merchant is located
                type:
                - string
                - 'null'
                example: US
              merchantLatitude:
                description: The latitude of the merchant
                type:
                - string
                - 'null'
                example: '38.9517'
              merchantLogoURL:
                description: The URL resource for the merchant's logo
                type: string
              merchantLongitude:
                description: The longitude of the merchant
                type:
                - string
                - 'null'
                example: '-92.3341'
              merchantName:
                description: The name of the merchant associated with the transaction
                type:
                - string
                - 'null'
                example: Dollar General
              merchantPhoneNumber:
                description: The phone number of the merchant associated with the transaction
                type:
                - string
                - 'null'
                example: 555-555-5555
              merchantState:
                description: The name of the state where the merchant is located
                type:
                - string
                - 'null'
                example: MO
              merchantType:
                description: The merchant's type
                type:
                - string
                - 'null'
                example: retail
              merchantZip:
                description: The ZIP code where the merchant is located
                type:
                - string
                - 'null'
                example: '65401'
              original_description:
                description: The transaction description as received. This will not change
                type: string
              receiptDate:
                description: The date on which FinSight API first received the transaction
                type:
                - string
                - 'null'
                format: date-time
                example: '2024-05-01T12:00:00Z'
              requestId:
                description: A unique ID for the request the transaction came in with, for debugging purposes
                type:
                - string
                - 'null'
                example: 04f00a35-a8fa-40fd-a2ee-4af7be22ed0a
              simple_description:
                description: An easy-to-understand, plain-language transaction description
                type: string
                deprecated: true
              simpleDescription:
                description: An easy-to-understand, plain-language transaction description
                type: string
              settlement:
                description: The settlement type of the transaction (e.g., 'debit' or 'credit')
                type:
                - string
                - 'null'
                example: debit
              sourceId:
                description: The source of the transaction
                type:
                - string
                - 'null'
                example: '1234'
              state:
                description: The state associated with the transaction
                type:
                - string
                - 'null'
                example: MO
              subtype:
                description: A more detailed classification of the transaction
                type:
                - string
                - 'null'
                example: purchase
              subType:
                description: A more detailed classification that provides further information on the type of transaction.
                type:
                - string
                - 'null'
                example: purchase
              tenant_id:
                description: The ID of the tenant associated with this transaction, if one was included.
                type:
                - string
                - 'null'
                example: TNT-4b7d4b7d-4b7d-4b7d-4b7d-4b7d4b7d4b7d
              transactionid:
                description: The ID of the transaction as it was originally submitted
                type: string
              transactionTags:
                description: The FinSight API issued tags for the transaction
                type: array
                items:
                  type: string
              transactionTagsId:
                description: The numeric IDs corresponding to the transaction tags
                type: array
                items:
                  type: integer
              type:
                description: An attribute describing the nature of the intent behind the transaction.
                type: string
              uid:
                description: The ID of the user associated with the transaction, as originally submitted
                type: string
              website:
                description: The merchant's website URL
                type:
                - string
                - 'null'
                example: https://links.fingoal.com/dollar-general
              zip_code:
                description: The ZIP code associated with the transaction
                type:
                - string
                - 'null'
                example: '65401'
        failedTransactions:
          type: array
          items:
            type: object
            properties:
              transactionid:
                description: The ID of the transaction as received.
                type: string
              amountnum:
                description: The transaction's USD amount as received.
                type: number
              original_description:
                description: The transaction description as received.
                type: string
              uid:
                description: The ID of the user associated with the transaction, as received.
                type: string
              date:
                description: The date on which the transaction took place as received.
                type: string
                format: date-time
              settlement:
                description: The transaction's settlement type as received.
                type: string
              accountType:
                description: The type of account associated with the transaction as received.
                type: string
    CleanupPostRequest:
      type: object
      required:
      - transactions
      properties:
        transactions:
          type: array
          items:
            type: object
            required:
            - accountType
            - amountnum
            - date
            - original_description
            - transactionid
            - settlement
            - uid
            properties:
              accountType:
                type: string
                description: 'The type of account associated with the transaction.


                  For transactions from loan accounts, use ''savings''.

                  '
                enum:
                - checking
                - savings
                - creditCard
                example: checking
              amountnum:
                type: number
                maxLength: 11
                description: The transaction amount in USD. Negative amounts are automatically converted to positive amounts. Use the 'settlement' field to indicate whether the transaction was a 'debit' or 'credit'. The string representation of amount must be fewer than 11 characters.
                example: 19.99
              date:
                description: The date of the transaction. Must be in the format 'YYYY-MM-DD'.
                type: string
                format: date
                example: '2024-05-01'
              identifiers:
                description: A JSON representation of alternative user IDs. This field is designed exclusively for users with Banno, Salesforce, or other CRM integrations. Valid identifiers are currently limited to [`sfmc_contact_id`, `banno_end_user_id`].
                type: object
                properties:
                  sfmc_contact_id:
                    type: string
                    example: sfmc-1234
                  banno_end_user_id:
                    type: string
                    example: banno-1234
              original_description:
                description: 'The transaction''s description. Must be between 3 and 198 characters. Descriptions longer than 198 characters are automatically truncated.


                  For transactions from loan accounts, prepend `LOANTRANS-` to this field.

                  '
                minLength: 1
                maxLength: 198
                type: string
                example: Cottonwood Supermarket & Deli
              transactionid:
                description: A unique identifier for the transaction. Do not use PII or other information-rich data in this field. We strongly recommend using UUID or a similar identification system.
                maxLength: 100
                type: string
                example: 178b1f61-dafe-4d47-837b-54ce34dc82b2
              settlement:
                description: Indicates whether the transaction was a 'debit' or 'credit' to the account.
                type: string
                enum:
                - debit
                - credit
                example: debit
              uid:
                description: The ID of the user associated with the transaction. User IDs must be unique. Do not use PII or other information-rich data in this field. We strongly recommend using UUID or a similar identification system.
                maxLength: 50
                type: string
                example: user123
              accountid:
                description: The account ID associated with the transaction. This field is optional and will not affect enrichment results. Do not use the actual account number. We strongly recommend using UUID or a similar identification system.
                maxLength: 50
                type: string
                example: account456
    EnrichmentNotificationPostRequest:
      type: object
      properties:
        batch_request_id:
          type: string
          description: The ID of the request that this webhook is associated with.
          format: uuid
          example: 5f4b1b9b-4b7d-4b7d-4b7d-4b7d4b7d4b7d
        client_id:
          type:
          - string
          - 'null'
          description: The ID of the client that this webhook is associated with.
          example: client-123
        tenant_id:
          type:
          - string
          - 'null'
          description: The ID of the tenant that this webhook is associated with, if the webhook is from a tenant environment.
          example: TNT-5f4b1b9b-4b7d-4b7d-4b7d-4b7d4b7d4b7d
  securitySchemes:
    Authentication:
      type: oauth2
