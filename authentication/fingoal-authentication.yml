- name: BearerAuth
  type: oauth2
  api: fingoal:fingoal-link-money-api
  flows:
  - flow: clientCredentials
    tokenUrl: https://link-money-dev.fingoal.dev/api/oauth/token
    scopes: 1
    scope_names:
